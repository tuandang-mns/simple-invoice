# One command from zero:  docker compose up --build
#   frontend → http://localhost:8080
#   backend  → http://localhost:3000   (Swagger: http://localhost:3000/api/docs)
#   postgres → localhost:5432
#
# Values come from ./.env if present (see .env.example); otherwise the defaults below apply.
# The defaults are for LOCAL DEMO ONLY — never reuse them in a real environment.

name: simple-invoice

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-simpleinvoice}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-simpleinvoice}
      POSTGRES_DB: ${POSTGRES_DB:-simpleinvoice}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-simpleinvoice}:${POSTGRES_PASSWORD:-simpleinvoice}@db:5432/${POSTGRES_DB:-simpleinvoice}?schema=public
      JWT_SECRET: ${JWT_SECRET:-local-demo-only-jwt-secret-change-me-0123456789}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-3600}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080,http://localhost:5173}
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Singapore}
      LOGIN_RATE_LIMIT: ${LOGIN_RATE_LIMIT:-10}
      LOGIN_RATE_TTL: ${LOGIN_RATE_TTL:-60}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-true}
      SEED_USER_EMAIL: ${SEED_USER_EMAIL:-admin@simpleinvoice.dev}
      SEED_USER_PASSWORD: ${SEED_USER_PASSWORD:-Password123!}
      SEED_USER_FULLNAME: ${SEED_USER_FULLNAME:-Demo Admin}
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      args:
        # Baked into the static bundle at build time; the browser calls the API directly.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:3000}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-8080}:8080"

volumes:
  db-data:
